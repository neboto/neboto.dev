# neboto.dev — built with Zola (https://www.getzola.org), deployed to GitHub
# Pages by .github/workflows/deploy.yml.
base_url = "https://neboto.dev"
title = "neboto"
description = "A fast, keyboard-driven, read-only terminal UI for browsing AWS."
compile_sass = false
build_search_index = true

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
generate_feeds = false
minify_html = false

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
smart_punctuation = true

[extra]
repo = "https://github.com/neboto/neboto-tui"
releases = "https://github.com/neboto/neboto-tui/releases"
install_cmd = "curl -fsSL https://raw.githubusercontent.com/neboto/neboto-tui/main/install.sh | sh"
